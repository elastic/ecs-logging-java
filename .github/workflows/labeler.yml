# pull_request_target is kept on purpose: it is the only trigger that gives PRs from forks a
# token that can write labels. No PR code is checked out or run; the job only calls the
# GitHub API with event metadata (actor, PR number).
name: "Issue Labeler"
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:

    - name: Get token
      id: get_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ secrets.OBS_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.OBS_AUTOMATION_APP_PEM }}
        permission-members: read
        permission-organization-projects: write
        permission-issues: read
        permission-pull-requests: write

    - name: Add agent-java label
      run: gh issue edit "${NUMBER}" --add-label "agent-java" --repo "${GH_REPO}"
      env:
        NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}

    - id: is_elastic_member
      uses: elastic/oblt-actions/github/is-member-of@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-org: "elastic"
        github-user: ${{ github.actor }}
        github-token: ${{ steps.get_token.outputs.token }}

    - id: user_type
      uses: elastic/oblt-actions/github/user-type@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-user: ${{ github.actor }}
        github-token: ${{ steps.get_token.outputs.token }}

    - name: debug
      run: |
        echo "::notice:: is_elastic_member=${IS_MEMBER}"
        echo "::notice:: user_type=${USER_TYPE}"
        echo "::notice:: github.actor=${ACTOR}"
        echo "::notice:: github.event_name=${EVENT_NAME}"
      env:
        IS_MEMBER: ${{ steps.is_elastic_member.outputs.result }}
        USER_TYPE: ${{ steps.user_type.outputs.result }}
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}

    - name: Add community and triage labels
      if: steps.is_elastic_member.outputs.result == 'false' && steps.user_type.outputs.result == 'user'
      run: gh issue edit "${NUMBER}" --add-label "community,triage" --repo "${GH_REPO}"
      env:
        NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}

    - name: Assign new internal pull requests to author
      id: assign-to-author
      if: steps.is_elastic_member.outputs.result == 'true' && github.event_name == 'pull_request_target'
      run: gh issue edit "${NUMBER}" --add-assignee "${ACTOR}" --repo "${GH_REPO}"
      env:
        ACTOR: ${{ github.actor }}
        NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}

    - name: Assign new internal pull requests to project
      id: add-to-project
      if: steps.is_elastic_member.outputs.result == 'true' && github.event_name == 'pull_request_target'
      uses: elastic/oblt-actions/github/project-add@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-token: ${{ steps.get_token.outputs.token }}
        project-id: 1829
        item-url: ${{ github.event.pull_request.html_url }}

    - name: set status in project
      id: set-project-status-field
      if: steps.is_elastic_member.outputs.result == 'true' && github.event_name == 'pull_request_target'
      uses: elastic/oblt-actions/github/project-field-set@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-token: ${{ steps.get_token.outputs.token }}
        project-id: 1829
        item-id: ${{ steps.add-to-project.outputs.item-id }}
        field-name: 'Status'
        field-value: 'In Progress'

    - name: set agent in project
      id: set-project-agent-field
      if: steps.is_elastic_member.outputs.result == 'true' && github.event_name == 'pull_request_target'
      uses: elastic/oblt-actions/github/project-field-set@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-token: ${{ steps.get_token.outputs.token }}
        project-id: 1829
        item-id: ${{ steps.add-to-project.outputs.item-id }}
        field-name: 'Agent'
        field-value: 'java'

    - name: set iteration in project
      id: set-project-iteration-field
      if: steps.is_elastic_member.outputs.result == 'true' && github.event_name == 'pull_request_target'
      uses: elastic/oblt-actions/github/project-field-set@208d03b3c3dfec874e5f2d73b2c938e493fc6953 # v1.43.0
      with:
        github-token: ${{ steps.get_token.outputs.token }}
        project-id: 1829
        item-id: ${{ steps.add-to-project.outputs.item-id }}
        field-name: 'Iteration'
        field-value: '@current'
        field-type: 'iteration'
