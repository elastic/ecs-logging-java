---

name: maven-goal
description: Install specific JDK and run a command

inputs:
  distribution:
    description: 'Java distribution'
    required: true
    default: 'temurin'
  command:
    description: 'Command to execute'
    required: true
  shell:
    description: 'Default shell'
    default: 'bash'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version-file: .java-version
        distribution: ${{ inputs.distribution }}
        # cache intentionally disabled (cache poisoning risk): shared by CI and release
        # workflows with no per-caller toggle, so it's off everywhere. elastic/observability-robots#3261
    - run: "${COMMAND}"
      shell: ${{ inputs.shell }}
      env:
        COMMAND: ${{ inputs.command }}